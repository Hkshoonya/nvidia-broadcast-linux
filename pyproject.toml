[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvbroadcast"
version = "1.5.2"
description = "NV Broadcast - Unofficial NVIDIA Broadcast for Linux and other OS by doczeus - AI-powered virtual camera, background removal, and noise cancellation"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "doczeus", email = "harshit@kshoonya.com"},
]
maintainers = [
    {name = "doczeus", email = "harshit@kshoonya.com"},
]
keywords = ["nvidia", "broadcast", "virtual-camera", "background-removal", "noise-cancellation", "linux", "doczeus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=1.26",
    "Pillow>=12.3.0",
    "opencv-contrib-python>=4.8.1.78,<5",
    # Current secure macOS wheels are Apple Silicon-only. Requiring 1.0.0
    # prevents Intel Macs from silently resolving an older vulnerable
    # fallback; install_macos.sh reports the architecture requirement first.
    "mediapipe>=1.0.0",
    "protobuf>=6.33.5,<7",
    # pyrnnoise publishes Linux wheels only. DeepFilterNet remains available
    # on macOS through ONNX Runtime without this fallback.
    "pyrnnoise>=0.4; sys_platform == 'linux'",
    # On Linux, pyrnnoise -> audiolab needs av.option (removed in av 17) AND
    # Codec.canonical_name (added in av 14); av 17+ breaks the denoiser at
    # import time and noise removal silently becomes a no-op.
    "av>=16,<17",
    "onnx>=1.22.0",
    "click>=8.3.3",
    "psutil>=5.9",
    "scipy>=1.11",
    "pyvirtualcam>=0.14; sys_platform == 'darwin'",
    "packaging>=26.0",
]

[project.urls]
Homepage = "https://nvbroadcast.com"
Repository = "https://github.com/Hkshoonya/nvidia-broadcast-linux"
Issues = "https://github.com/Hkshoonya/nvidia-broadcast-linux/issues"

[project.optional-dependencies]
dev = ["pytest>=9.0.3"]
cpu = [
    # Version 1.23.2 keeps the supported Apple Silicon runtime on macOS 13+.
    "onnxruntime>=1.23.2,<1.24; sys_platform == 'darwin'",
    "onnxruntime>=1.24.4,<1.25; sys_platform != 'darwin'",
]
cuda = [
    "cupy-cuda12x>=14.1.1,<15",
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-curand-cu12",
    "nvidia-cufft-cu12",
    "nvidia-nvjitlink-cu12",
    "nvidia-cuda-nvrtc-cu12",
    # GPU MJPEG decode for the device-resident frame path (optional at
    # runtime: the pipeline falls back to jpegdec when unavailable).
    # nvimgcodec dlopens libnvjpeg at probe time; without the nvjpeg
    # wheel the probe fails and JPEG decode silently lands on the CPU.
    "nvidia-nvimgcodec-cu12",
    "nvidia-nvjpeg-cu12",
    "onnxruntime-gpu==1.24.4",
]
# Preserve the public meeting extra without allowing faster-whisper's
# onnxruntime requirement to select a runtime owner. Managed installers add
# faster-whisper separately with --no-deps after choosing cpu or cuda.
meeting = [
    'openai-whisper>=20231117; python_version < "3.14"',
]
meeting-support = [
    "ctranslate2",
    "huggingface-hub",
    "httpx",
    "tokenizers",
    "soundfile",
    "tqdm",
]
maxine = ["nvidia-vfx"]
tensorrt = ["tensorrt", "tensorrt-cu12", "onnx"]

[project.scripts]
nvbroadcast = "nvbroadcast.__main__:main"
nvbroadcast-vcam = "nvbroadcast.vcam_service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nvbroadcast.ui" = ["style.css"]

[tool.setuptools.data-files]
"share/doc/nvbroadcast" = [
    "CONTRIBUTORS.md",
    "NOTICE",
]
"share/applications" = ["data/com.doczeus.NVBroadcast.desktop"]
"share/metainfo" = ["data/com.doczeus.NVBroadcast.metainfo.xml"]
"share/icons/hicolor/scalable/apps" = ["data/icons/com.doczeus.NVBroadcast.svg"]
"share/icons/hicolor/128x128/apps" = ["data/icons/com.doczeus.NVBroadcast.png"]
"share/nvbroadcast/backgrounds" = [
    "data/backgrounds/gradient_bg.png",
    "data/backgrounds/studio_bg.png",
    "data/backgrounds/test_bg.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "build", "dist"]
