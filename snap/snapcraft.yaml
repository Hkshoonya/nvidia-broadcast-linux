name: nvbroadcast
title: NV Broadcast
base: core24
version: '1.5.2'
summary: Reliable camera startup, verified runtimes, and safe upgrades
description: |
  NV Broadcast is an AI-powered virtual camera and voice enhancement app for
  Linux. It brings background blur, background replace, green-screen remove,
  eye contact correction, face relighting, video enhancement, recording, and
  local meeting transcription into one app.

  What's new in v1.5.2:
  - Recovers when a camera's preferred MJPEG mode fails before its first frame
    by retrying another advertised format at the same resolution and frame rate.
  - Gives local meeting transcription workers a private Snap shared-memory namespace.
  - Selects a fully supported Python 3.11-3.13 interpreter for source installs,
    validates matching desktop bindings, and fails with targeted guidance.
  - Pins every Snap Store review, candidate, and stable dispatch to a validated
    release tag and source commit before any build or upload can begin.
  - Shows cumulative contributor credits in the About window and validates that
    accepted external contributors remain credited in future releases.
  - Carries the complete tested v1.5.1 native-upgrade, runtime, device-recovery,
    and provenance work; v1.5.0 and v1.5.1 were not public stable releases.
  - Adds a hash-bound GitHub native-package helper that safely migrates known
    legacy DEB and RPM removal scripts before installing exact artifacts.
  - Removes installer-generated runtime and build files on final DEB/RPM
    uninstall, including clean package-only removal paths.
  - Enforces exactly one CPU or CUDA ONNX Runtime distribution owner in source,
    native-package, macOS, and Snap environments.
  - Verifies CPU, CUDA, and TensorRT readiness with pinned fresh-process model
    execution, rejects silent CPU fallback, and retains provider diagnostics.
  - Adds explicit source runtime selection with clean CPU recovery for failed
    automatic CUDA setup and restart-gated runtime changes.
  - Restores the saved microphone shown in the selector and rebuilds a running
    audio pipeline when the capture device changes.
  - Stops GUI and headless startup cleanly when no usable camera is available
    instead of constructing a broken capture pipeline.
  - Makes profile auto-start an explicit per-profile opt-in and keeps controls
    aligned when a busy or missing camera prevents startup.
  - Adds MediaPipe 1.0.0 face effects on Linux arm64 and raises OpenCV,
    Protobuf, Pillow, pip, and pytest security floors.
  - Strengthens strict Snap dependency closure, launcher validation, reviewed
    revision promotion, rollback, and post-promotion metadata refresh.
  - Publishes checksums for attached release assets and GitHub provenance,
    while stable promotion verifies both architectures against the release tag.

  Recent quality updates:
  - v1.4.0 adds rebindable global effect shortcuts, Gaze Lock, live camera
    switching, crash-safe processing reloads, and improved hair-edge and
    microphone behavior.
  - v1.3.0 adds a device-resident NVIDIA video path, stronger blur controls,
    safe camera and microphone power saving, corrected Apple Silicon camera
    selection, and cleaner sunlit replacement edges.
  - Compute selection lets users choose Auto, GPU Focused, or CPU Focused
    behavior. GPU Focused selects the DocZeus/CUDA path when available, while
    CPU Focused keeps users on CPU modes when preferred.
  - The arm64 Snap build stays portable and CPU-safe until Linux arm64 GPU
    wheels are available from upstream providers.

  Core features:
  - Blur your background
  - Replace your background with an image
  - Remove your background for green-screen workflows
  - Eye contact correction while reading or presenting
  - Face relighting to better match the background
  - Video enhancement with skin smooth, denoise, enhance, and sharpen controls
  - Voice studio tools plus local AI meeting transcription and summaries
  - DocZeus, Zeus, Killer, CUDA, and CPU processing modes for different systems
  - Works with Zoom, Chrome, OBS, Discord, and other webcam apps

  For install guides, release downloads, feature breakdowns, and upgrade
  instructions, visit the official website:
  https://nvbroadcast.domjarvis.com

grade: stable
confinement: strict
license: GPL-3.0
icon: data/icons/com.doczeus.NVBroadcast.svg
website: https://nvbroadcast.domjarvis.com
source-code: https://github.com/Hkshoonya/nvidia-broadcast-linux
issues: https://github.com/Hkshoonya/nvidia-broadcast-linux/issues
contact: https://nvbroadcast.domjarvis.com

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

plugs:
  shared-memory:
    interface: shared-memory
    private: true

slots:
  nvbroadcast-dbus:
    interface: dbus
    bus: session
    name: com.doczeus.NVBroadcast

apps:
  nvbroadcast:
    command: bin/nvbroadcast-wrapper
    extensions: [gnome]
    desktop: share/applications/com.doczeus.NVBroadcast.desktop
    slots:
      - nvbroadcast-dbus
    plugs:
      - home
      - network
      - shared-memory
      - camera
      - audio-playback
      - audio-record
      - opengl
      - hardware-observe
      - process-control
      - system-observe
    environment:
      PYTHONPATH: $SNAP/lib/python3.12/site-packages:$SNAP/lib/python3/dist-packages:$SNAP/usr/lib/python3/dist-packages

parts:
  nvbroadcast:
    plugin: python
    source: .
    python-packages:
      - numpy
      - opencv-contrib-python>=4.8.1.78,<5
      - packaging>=26.0
      - setuptools>=83.0.0
      - protobuf>=6.33.5,<7
      - onnx>=1.22.0
      - click>=8.3.3
      - ctranslate2
      - huggingface-hub
      - httpx
      - tokenizers
      - soundfile
      - av>=16,<17
      - scipy
      # Required by both ONNX Runtime distributions. Declare it outside the
      # architecture-owned runtime install because those installs use --no-deps.
      - sympy
      - pyrnnoise
      - psutil
      - Pillow>=12.3.0
      - requests
    stage-packages:
      - pipewire-bin
      - pulseaudio-utils
      - v4l-utils
      - gnome-settings-daemon-common
    override-build: |
      craftctl default
      # The GNOME build extension puts its SDK interpreter first on PATH.
      # That SDK is not mounted under strict confinement, so make the venv use
      # core24's runtime Python and remove build-host provenance before packing.
      PYVENV_CFG="$CRAFT_PART_INSTALL/pyvenv.cfg"
      if [ ! -f "$PYVENV_CFG" ]; then
        echo "Missing Python virtual environment metadata: $PYVENV_CFG" >&2
        exit 1
      fi
      sed -i \
        -e 's|^home = .*|home = /usr/bin|' \
        -e '/^executable = /d' \
        -e '/^command = /d' \
        "$PYVENV_CFG"
      if ! grep -qx 'home = /usr/bin' "$PYVENV_CFG" || \
        grep -Eq '/build(/|$)|/snap/[^/[:space:]]*-sdk(/|$)' "$PYVENV_CFG"; then
        echo "Python virtual environment contains a non-runtime path:" >&2
        cat "$PYVENV_CFG" >&2
        exit 1
      fi
      SNAP_PYTHON_SITE="$CRAFT_PART_INSTALL/lib/python3/dist-packages"
      mkdir -p "$SNAP_PYTHON_SITE"
      case "${CRAFT_ARCH_BUILD_FOR:-$(uname -m)}" in
        amd64|x86_64)
          echo "Installing sole amd64 CUDA runtime owner into Snap..."
          python3 -m pip install --no-cache-dir --upgrade \
            --timeout 120 \
            --retries 5 \
            --no-deps \
            --target "$SNAP_PYTHON_SITE" \
            onnxruntime-gpu==1.24.4 \
            "cupy-cuda12x>=14.1.1,<15" \
            "cuda-pathfinder>=1.3.4,<2" \
            nvidia-cublas-cu12 \
            nvidia-cuda-runtime-cu12 \
            nvidia-cudnn-cu12 \
            nvidia-curand-cu12 \
            nvidia-cufft-cu12 \
            nvidia-nvjitlink-cu12 \
            nvidia-cuda-nvrtc-cu12
          # nvImageCodec + nvJPEG add about 256 MB installed. The Snap keeps
          # GStreamer's CPU MJPEG decoder and still uses CUDA for inference,
          # compositing, colorspace conversion, and virtual-camera output.
          ;;
        *)
          echo "Installing sole arm64 CPU runtime owner into Snap..."
          python3 -m pip install --no-cache-dir --upgrade \
            --no-deps \
            --target "$SNAP_PYTHON_SITE" \
            onnxruntime==1.24.4
          ;;
      esac
      # faster-whisper declares the CPU distribution name. Install its code
      # without dependencies so amd64 keeps onnxruntime-gpu as sole owner.
      python3 -m pip install --no-cache-dir --upgrade \
        --no-deps \
        --target "$SNAP_PYTHON_SITE" \
        faster-whisper==1.2.1
      # Optional runtime installation is disabled inside the immutable Snap.
      # Remove the Python plugin's build-time package installer from the final
      # runtime instead of carrying a second mutable package-management path.
      rm -f -- \
        "$CRAFT_PART_INSTALL/bin/pip" \
        "$CRAFT_PART_INSTALL/bin/pip3" \
        "$CRAFT_PART_INSTALL"/bin/pip3.*
      for SNAP_SITE in \
        "$CRAFT_PART_INSTALL"/lib/python*/site-packages \
        "$CRAFT_PART_INSTALL"/lib/python*/dist-packages; do
        [ -d "$SNAP_SITE" ] || continue
        rm -rf -- "$SNAP_SITE/pip"
        find "$SNAP_SITE" -maxdepth 1 -type d -name 'pip-*.dist-info' \
          -exec rm -rf -- {} +
      done
      # Create wrapper script
      mkdir -p $CRAFT_PART_INSTALL/bin
      cat > $CRAFT_PART_INSTALL/bin/nvbroadcast-wrapper << 'EOF'
      #!/bin/bash
      ARCH="$(uname -m)"
      case "$ARCH" in
        aarch64|arm64) TRIPLET="aarch64-linux-gnu" ;;
        *) TRIPLET="x86_64-linux-gnu" ;;
      esac
      PLATFORM_LIB="$SNAP/gnome-platform/usr/lib/$TRIPLET"
      export GST_PLUGIN_PATH="$PLATFORM_LIB/gstreamer-1.0${GST_PLUGIN_PATH:+:$GST_PLUGIN_PATH}"
      export GI_TYPELIB_PATH="$PLATFORM_LIB/girepository-1.0:$SNAP/gnome-platform/usr/lib/girepository-1.0${GI_TYPELIB_PATH:+:$GI_TYPELIB_PATH}"
      CUDA_RUNTIME="$SNAP/lib/python3/dist-packages/nvidia/cuda_runtime"
      if [ -z "${CUDA_PATH:-}" ] && [ -f "$CUDA_RUNTIME/include/cuda_runtime.h" ]; then
        export CUDA_PATH="$CUDA_RUNTIME"
      fi
      cd $SNAP
      exec python3 -m nvbroadcast "$@"
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/nvbroadcast-wrapper

  # NVIDIA GPU support (for users with NVIDIA drivers)
  nvidia-support:
    plugin: nil
    stage-packages:
      - libgl1
      - libgles2
    after: [nvbroadcast]

layout:
  /usr/share/libdrm:
    bind: $SNAP/usr/share/libdrm
