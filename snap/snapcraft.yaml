name: nvbroadcast
title: NV Broadcast
base: core24
version: '1.4.0'
summary: Global hotkeys, Gaze Lock, and reliable mode switching
description: |
  NV Broadcast is an AI-powered virtual camera and voice enhancement app for
  Linux. It brings background blur, background replace, green-screen remove,
  eye contact correction, face relighting, video enhancement, recording, and
  local meeting transcription into one app.

  What's new in v1.4.0:
  - Adds rebindable Linux global shortcuts for effect toggles through the XDG
    GlobalShortcuts portal or a restricted GNOME fallback.
  - Adds Natural and Gaze Lock Eye Contact modes with coordinated binocular
    targeting, blink fallback, and smooth head-pose updates.
  - Switches physical cameras at runtime and applies profiles safely when a
    video backend can provide only one current frame.
  - Rebuilds and atomically swaps RVM sessions during quality or processing
    mode changes, with clean CUDA recovery and CPU fallback.
  - Preserves more head-hair and facial-hair detail in Ultra quality while
    suppressing neutral and bright background spill on soft edges.
  - Keeps microphone capture active so Discord and other Pulse/PipeWire
    clients do not retain multi-second latency after opening the virtual mic.
  - Uses one bounded OpenCV 4 owner and validates packaged dependencies before
    artifact upload.
  - Keeps runtime installers out of immutable package environments and removes
    pip from Snap.
  - Removes GTK image baseline warnings and harmonizes runtime log prefixes.

  Recent quality updates:
  - v1.3.0 adds a device-resident NVIDIA video path, stronger blur controls,
    safe camera and microphone power saving, corrected Apple Silicon camera
    selection, and cleaner sunlit replacement edges.
  - v1.2.3 stabilizes Quality and Ultra mattes in strongly backlit scenes
    without changing displayed camera colors.
  - v1.2.2 derives one shared binocular camera target, preserves natural iris
    spacing, and reduces coordinated eye-tracking latency.
  - v1.2.1 makes moderate eye contact correction visible at the default
    intensity, preserves frame alpha, and includes corrected macOS OBS output.
  - v1.2.0 adds DeepFilterNet3 noise removal, lower background CPU use, a native
    StatusNotifierItem tray, verified model storage, and configurable Linux
    virtual-camera output.
  - v1.1.13 adds Center Face and Stable Background Auto Frame modes and fixes
    minimum-zoom tracking.
  - v1.1.12 fixes OBS startup reliability, phone webcam fallback behavior,
    audio filtering dependency installs, and packaged meeting runtime support.
  - v1.1.11 fixes white preview and missing-effects cases in OBS and meeting
    apps when cameras expose raw video modes instead of MJPEG.
  - Camera startup avoids stale, metadata-only, and virtual-loopback source
    nodes after reboot or device-order changes.
  - Source, Debian, RPM, and amd64 Snap installs include the corrected CUDA
    runtime path for NVIDIA systems.
  - v1.1.10 improves live background replacement edges around hair, shoulders,
    raised hands, and finger gaps.
  - Compute selection lets users choose Auto, GPU Focused, or CPU Focused
    behavior. GPU Focused selects the DocZeus/CUDA path when available, while
    CPU Focused keeps users on CPU modes when preferred.
  - The arm64 Snap build stays portable and CPU-safe until Linux arm64 GPU
    wheels are available from upstream providers.

  Core features:
  - Blur your background
  - Replace your background with an image
  - Remove your background for green-screen workflows
  - Eye contact correction while reading or presenting
  - Face relighting to better match the background
  - Video enhancement with skin smooth, denoise, enhance, and sharpen controls
  - Voice studio tools plus local AI meeting transcription and summaries
  - DocZeus, Zeus, Killer, CUDA, and CPU processing modes for different systems
  - Works with Zoom, Chrome, OBS, Discord, and other webcam apps

  For install guides, release downloads, feature breakdowns, and upgrade
  instructions, visit the official website:
  https://nvbroadcast.domjarvis.com

grade: stable
confinement: strict
license: GPL-3.0
icon: data/icons/com.doczeus.NVBroadcast.svg
website: https://nvbroadcast.domjarvis.com
source-code: https://github.com/Hkshoonya/nvidia-broadcast-linux
issues: https://github.com/Hkshoonya/nvidia-broadcast-linux/issues
contact: https://nvbroadcast.domjarvis.com

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

slots:
  nvbroadcast-dbus:
    interface: dbus
    bus: session
    name: com.doczeus.NVBroadcast

apps:
  nvbroadcast:
    command: bin/nvbroadcast-wrapper
    extensions: [gnome]
    slots:
      - nvbroadcast-dbus
    plugs:
      - home
      - network
      - camera
      - audio-playback
      - audio-record
      - opengl
      - hardware-observe
      - process-control
      - system-observe
    environment:
      PYTHONPATH: $SNAP/lib/python3/dist-packages:$SNAP/usr/lib/python3/dist-packages

parts:
  nvbroadcast:
    plugin: python
    source: .
    python-packages:
      - numpy
      - opencv-contrib-python>=4.8.1.78,<5
      - packaging>=26.0
      - setuptools>=83.0.0
      - protobuf>=6.33.5,<7
      - onnxruntime==1.24.4
      - onnx>=1.22.0
      - click>=8.3.3
      - faster-whisper
      - ctranslate2
      - huggingface-hub
      - httpx
      - tokenizers
      - soundfile
      - av>=16,<17
      - scipy
      - pyrnnoise
      - psutil
      - Pillow
      - requests
    stage-packages:
      - python3-gi
      - python3-gi-cairo
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - gir1.2-gstreamer-1.0
      - gir1.2-gst-plugins-base-1.0
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - pipewire-bin
      - pulseaudio-utils
      - v4l-utils
      - libayatana-appindicator3-1
      - gir1.2-ayatanaappindicator3-0.1
      - gnome-settings-daemon-common
    override-build: |
      craftctl default
      SNAP_PYTHON_SITE="$CRAFT_PART_INSTALL/lib/python3/dist-packages"
      mkdir -p "$SNAP_PYTHON_SITE"
      case "${CRAFT_ARCH_BUILD_FOR:-$(uname -m)}" in
        amd64|x86_64)
          echo "Installing amd64 CUDA mode runtime into Snap..."
          # The base site already owns shared Python dependencies; keep the
          # higher-priority CUDA overlay limited to its explicit GPU payload.
          python3 -m pip install --no-cache-dir --upgrade \
            --no-deps \
            --target "$SNAP_PYTHON_SITE" \
            onnxruntime-gpu==1.24.4 \
            "cupy-cuda12x>=14.1.1,<15" \
            "cuda-pathfinder>=1.3.4,<2" \
            nvidia-cublas-cu12 \
            nvidia-cuda-runtime-cu12 \
            nvidia-cudnn-cu12 \
            nvidia-curand-cu12 \
            nvidia-cufft-cu12 \
            nvidia-nvjitlink-cu12 \
            nvidia-cuda-nvrtc-cu12
          # nvImageCodec + nvJPEG add about 256 MB installed. The Snap keeps
          # GStreamer's CPU MJPEG decoder and still uses CUDA for inference,
          # compositing, colorspace conversion, and virtual-camera output.
          ;;
        *)
          echo "Skipping CUDA mode runtime for ${CRAFT_ARCH_BUILD_FOR:-$(uname -m)} Snap build."
          ;;
      esac
      # Optional runtime installation is disabled inside the immutable Snap.
      # Remove the Python plugin's build-time package installer from the final
      # runtime instead of carrying a second mutable package-management path.
      rm -f -- \
        "$CRAFT_PART_INSTALL/bin/pip" \
        "$CRAFT_PART_INSTALL/bin/pip3" \
        "$CRAFT_PART_INSTALL"/bin/pip3.*
      for SNAP_SITE in \
        "$CRAFT_PART_INSTALL"/lib/python*/site-packages \
        "$CRAFT_PART_INSTALL"/lib/python*/dist-packages; do
        [ -d "$SNAP_SITE" ] || continue
        rm -rf -- "$SNAP_SITE/pip"
        find "$SNAP_SITE" -maxdepth 1 -type d -name 'pip-*.dist-info' \
          -exec rm -rf -- {} +
      done
      # Create wrapper script
      mkdir -p $CRAFT_PART_INSTALL/bin
      cat > $CRAFT_PART_INSTALL/bin/nvbroadcast-wrapper << 'EOF'
      #!/bin/bash
      ARCH="$(uname -m)"
      case "$ARCH" in
        aarch64|arm64) TRIPLET="aarch64-linux-gnu" ;;
        *) TRIPLET="x86_64-linux-gnu" ;;
      esac
      export GST_PLUGIN_PATH="$SNAP/usr/lib/$TRIPLET/gstreamer-1.0${GST_PLUGIN_PATH:+:$GST_PLUGIN_PATH}"
      export GI_TYPELIB_PATH="$SNAP/usr/lib/$TRIPLET/girepository-1.0${GI_TYPELIB_PATH:+:$GI_TYPELIB_PATH}"
      CUDA_RUNTIME="$SNAP/lib/python3/dist-packages/nvidia/cuda_runtime"
      if [ -z "${CUDA_PATH:-}" ] && [ -f "$CUDA_RUNTIME/include/cuda_runtime.h" ]; then
        export CUDA_PATH="$CUDA_RUNTIME"
      fi
      cd $SNAP
      exec python3 -m nvbroadcast "$@"
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/nvbroadcast-wrapper

  # NVIDIA GPU support (for users with NVIDIA drivers)
  nvidia-support:
    plugin: nil
    stage-packages:
      - libgl1
      - libgles2
    after: [nvbroadcast]

layout:
  /usr/share/libdrm:
    bind: $SNAP/usr/share/libdrm
