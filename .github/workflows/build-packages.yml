name: Build Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sign_macos:
        description: 'Sign, notarize and staple the macOS installer (requires macos-signing environment secrets)'
        type: boolean
        default: false
      macos_recovery_operation:
        description: 'Use status/resume to recover an existing notarization request without building or submitting again'
        type: choice
        options: [none, status, resume]
        default: none
      submission_id:
        description: 'Existing Apple submission UUID (status only)'
        type: string
      source_run_id:
        description: 'Original Build Packages run ID (resume only)'
        type: string
      source_attempt:
        description: 'Original signing attempt with the retained checkpoint (resume only)'
        type: string
      source_sha256:
        description: 'Independently verified original unsigned PKG SHA-256 (resume only)'
        type: string
      signed_sha256:
        description: 'Independently verified pre-staple signed upload SHA-256 (resume only)'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONNOUSERSITE: "1"

permissions:
  contents: read

jobs:
  # ─── Linux: .deb + .rpm ────────────────────────────────────────────────────
  build-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.macos_recovery_operation == 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm python3

      - name: Build .deb package
        run: bash build-packages.sh deb

      - name: Build .rpm package
        run: bash build-packages.sh rpm

      - name: Inspect attribution records in native packages
        run: |
          deb="$(find dist/deb -name '*.deb' -type f -print -quit)"
          rpm="$(find dist/rpm -name '*.rpm' -type f -print -quit)"
          test -n "$deb"
          test -n "$rpm"
          mkdir -p /tmp/nvbroadcast-deb-attribution
          dpkg-deb -x "$deb" /tmp/nvbroadcast-deb-attribution
          test -f /tmp/nvbroadcast-deb-attribution/opt/nvbroadcast/NOTICE
          test -f /tmp/nvbroadcast-deb-attribution/opt/nvbroadcast/CONTRIBUTORS.md
          test -f /tmp/nvbroadcast-deb-attribution/usr/share/doc/nvbroadcast/NOTICE
          test -f /tmp/nvbroadcast-deb-attribution/usr/share/doc/nvbroadcast/CONTRIBUTORS.md
          rpm -qlp "$rpm" > /tmp/nvbroadcast-rpm-files
          grep -Fxq '/opt/nvbroadcast/NOTICE' /tmp/nvbroadcast-rpm-files
          grep -Fxq '/opt/nvbroadcast/CONTRIBUTORS.md' /tmp/nvbroadcast-rpm-files
          # RPM's standard doc/license directory may include the version on
          # Ubuntu builders. Check the native file classifications, not a
          # Fedora-specific directory spelling.
          rpm -qp --qf '[%{FILENAMES} %{FILEFLAGS:fflags}\n]' "$rpm" > /tmp/nvbroadcast-rpm-fileflags
          grep -Eq '/LICENSE [a-z]*l[a-z]*$' /tmp/nvbroadcast-rpm-fileflags
          grep -Eq '/NOTICE [a-z]*l[a-z]*$' /tmp/nvbroadcast-rpm-fileflags
          grep -Eq '/CONTRIBUTORS[.]md [a-z]*d[a-z]*$' /tmp/nvbroadcast-rpm-fileflags

      - name: Build verified native-package upgrader
        run: |
          bash build-packages.sh upgrade-helper
          test -x dist/nvbroadcast-native-upgrade
          if grep -Eq '@(TARGET_(VERSION|REVISION)|DEB_SHA256|RPM_SHA256)@' dist/nvbroadcast-native-upgrade; then
            echo "::error::Native-package upgrader contains unresolved release placeholders."
            exit 1
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-packages
          path: |
            dist/deb/*.deb
            dist/rpm/*.rpm
            dist/nvbroadcast-native-upgrade

  # ─── macOS: .pkg ───────────────────────────────────────────────────────────
  build-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.macos_recovery_operation == 'none'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      - name: Build .pkg installer
        run: bash build-packages.sh pkg

      - name: Inspect .pkg payload
        run: |
          package="$(find dist/pkg -name '*.pkg' -type f -print -quit)"
          test -n "$package"
          rm -rf /tmp/nvbroadcast-pkg-expanded
          pkgutil --expand-full "$package" /tmp/nvbroadcast-pkg-expanded
          test -n "$(find /tmp/nvbroadcast-pkg-expanded -path '*/opt/nvbroadcast/src/nvbroadcast/__init__.py' -print -quit)"
          test -n "$(find /tmp/nvbroadcast-pkg-expanded -path '*/opt/nvbroadcast/NOTICE' -print -quit)"
          test -n "$(find /tmp/nvbroadcast-pkg-expanded -path '*/opt/nvbroadcast/CONTRIBUTORS.md' -print -quit)"
          test -n "$(find /tmp/nvbroadcast-pkg-expanded -path '*/usr/local/bin/nvbroadcast' -print -quit)"
          runtime_installer="$(find /tmp/nvbroadcast-pkg-expanded -path '*/opt/nvbroadcast/scripts/install_runtime_variant.py' -print -quit)"
          test -x "$runtime_installer"
          distribution="$(find /tmp/nvbroadcast-pkg-expanded -name Distribution -type f -print -quit)"
          test -n "$distribution"
          grep -q 'hostArchitectures="arm64"' "$distribution"
          grep -q '<os-version min="13.0"' "$distribution"
          find /tmp/nvbroadcast-pkg-expanded -name postinstall -type f -exec bash -n {} \;

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-packages
          path: dist/pkg/*.pkg

  # Exercise the installed package without camera/microphone capture.
  test-macos-runtime:
    if: github.event_name != 'workflow_dispatch' || inputs.macos_recovery_operation == 'none'
    name: Test installed macOS runtime (Apple Silicon)
    env:
      GST_PLUGIN_PATH: /opt/homebrew/lib/gstreamer-1.0
      GI_TYPELIB_PATH: /opt/homebrew/lib/girepository-1.0
    needs: build-macos
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install user runtime prerequisites
        run: brew install python@3.13 pygobject3 gtk4 libadwaita gstreamer

      - name: Download this run's package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-packages
          path: dist/pkg-test

      - name: Prepare package destination on the disposable runner
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]
          mkdir -p dist/macos-runtime
          /bin/ls -lde /opt /usr /usr/local /usr/local/bin \
            > dist/macos-runtime/destination-access-before.txt 2>&1 || true
          # This image makes /usr/local/bin runner-owned and group-writable.
          # Prepare only that directory for the package's admin-owned profile.
          # The production installer never changes existing ownership or ACLs.
          for directory in /usr /usr/local /usr/local/bin; do
            if [[ -L "$directory" ]]; then
              echo "::error::Refusing redirected runner package destination: $directory"
              exit 1
            fi
          done
          sudo /usr/bin/install -d -o root -g wheel -m 755 /usr/local/bin
          [[ "$(/usr/bin/stat -f '%u %Lp' /usr/local/bin)" == '0 755' ]]
          /bin/ls -lde /opt /usr /usr/local /usr/local/bin \
            > dist/macos-runtime/destination-access-prepared.txt

      - name: Install package and provision runtime as the user
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/pkg-test/*.pkg)
          (( ${#packages[@]} == 1 ))
          mkdir -p dist/macos-runtime
          /bin/ls -lde /opt /usr /usr/local /usr/local/bin \
            > dist/macos-runtime/destination-access.txt 2>&1 || true
          sudo /usr/sbin/installer -verboseR -dumplog -pkg "${packages[0]}" -target / \
            2>&1 | tee dist/macos-runtime/installer.log
          /opt/nvbroadcast/scripts/setup_macos_runtime.sh
          package_id="$(cat /opt/nvbroadcast/macos-package-version)"
          runtime_id="$(cat /opt/nvbroadcast/macos-runtime-id)"
          runtime_python="$HOME/Library/Application Support/NVBroadcast/$package_id-$runtime_id/.venv/bin/python"
          test -x "$runtime_python"
          printf 'MACOS_RUNTIME_PYTHON=%s\n' "$runtime_python" >> "$GITHUB_ENV"
          /usr/local/bin/nvbroadcast --help
          "$runtime_python" -m pip check

      - name: Validate actual imports, CPU inference and generated recording
        run: |
          mkdir -p dist/macos-runtime
          "$MACOS_RUNTIME_PYTHON" scripts/validate_macos_runtime.py \
            --output dist/macos-runtime/qualification.json

      - name: Check macOS audio routing without devices
        env:
          PYTHONPATH: src
        run: |
          "$MACOS_RUNTIME_PYTHON" -m unittest -v tests.test_macos_audio

      - name: Retain native Installer diagnostics
        if: always()
        run: |
          mkdir -p dist/macos-runtime
          if [[ -f /var/log/install.log ]]; then
            sudo /usr/bin/tail -n 1000 /var/log/install.log > dist/macos-runtime/system-install.log
          fi

      - name: Upload installed-runtime qualification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-runtime-qualification
          path: dist/macos-runtime
          if-no-files-found: ignore

  # Signing credentials are confined to this manual/tag job and its environment.
  # Unsigned build artifacts remain available for inspection, never for release.
  sign-macos:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign_macos && inputs.macos_recovery_operation == 'none')
    needs: [build-macos, test-macos, test-macos-runtime]
    runs-on: macos-15
    timeout-minutes: 50
    environment: macos-signing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Download this run's unsigned macOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-packages
          path: dist/pkg-unsigned

      - name: Configure isolated signing keychain
        env:
          MACOS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          for name in MACOS_INSTALLER_CERTIFICATE_P12_BASE64 MACOS_INSTALLER_CERTIFICATE_PASSWORD MACOS_NOTARY_APPLE_ID MACOS_NOTARY_APP_PASSWORD MACOS_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing macos-signing environment secret: $name"
              exit 1
            fi
          done
          if [[ ! "$MACOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::MACOS_TEAM_ID must be the ten-character Apple Developer team identifier."
            exit 1
          fi
          signing_temp="$(mktemp -d "$RUNNER_TEMP/nvbroadcast-signing.XXXXXX")"
          printf 'MACOS_SIGNING_TEMP=%s\n' "$signing_temp" >> "$GITHUB_ENV"
          keychain="$signing_temp/installer.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -base64 32)"
          printf '::add-mask::%s\n' "$keychain_password"
          printf '%s' "$MACOS_INSTALLER_CERTIFICATE_P12_BASE64" | /usr/bin/base64 --decode > "$signing_temp/certificate.p12"
          printf '%s' "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" > "$signing_temp/certificate-password"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 3600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security import "$signing_temp/certificate.p12" -k "$keychain" -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productsign
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          /usr/bin/openssl pkcs12 -in "$signing_temp/certificate.p12" -passin "file:$signing_temp/certificate-password" -clcerts -nokeys -out "$signing_temp/certificate.pem"
          /usr/bin/openssl x509 -in "$signing_temp/certificate.pem" -noout -subject -nameopt sep_multiline,sname > "$signing_temp/certificate-subject"
          python3 - "$MACOS_TEAM_ID" "$signing_temp/certificate-subject" <<'PYTHON'
          import sys
          from pathlib import Path
          fields = {}
          for line in Path(sys.argv[2]).read_text().splitlines():
              key, separator, value = line.strip().partition('=')
              if separator:
                  fields[key.strip()] = value.strip()
          team = sys.argv[1]
          if fields.get('OU') != team or not fields.get('CN', '').startswith('Developer ID Installer: ') or not fields['CN'].endswith(f'({team})'):
              raise SystemExit('Expected a Developer ID Installer certificate for MACOS_TEAM_ID.')
          PYTHON
          identity="$(/usr/bin/openssl x509 -in "$signing_temp/certificate.pem" -noout -sha1 -fingerprint | cut -d= -f2 | tr -d ':')"
          if [[ ! "$identity" =~ ^[A-Fa-f0-9]{40}$ ]]; then
            echo "::error::Could not determine the certificate identity."
            exit 1
          fi
          /usr/bin/xcrun notarytool store-credentials nvbroadcast-notary \
            --apple-id "$MACOS_NOTARY_APPLE_ID" --team-id "$MACOS_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" --keychain "$keychain"
          printf 'MACOS_SIGNING_KEYCHAIN=%s\nMACOS_INSTALLER_IDENTITY=%s\nMACOS_SIGNING_TEAM_ID=%s\n' "$keychain" "$identity" "$MACOS_TEAM_ID" >> "$GITHUB_ENV"
          rm -f "$signing_temp/certificate.p12" "$signing_temp/certificate-password" "$signing_temp/certificate.pem" "$signing_temp/certificate-subject"

      - name: Sign, notarize and verify the installer
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/pkg-unsigned/*.pkg)
          if (( ${#packages[@]} != 1 )); then
            echo "::error::Expected exactly one package from this workflow run."
            exit 1
          fi
          mkdir -p dist/pkg-signed dist/macos-signing
          python3 scripts/sign_macos_package.py \
            --input "${packages[0]}" \
            --output "dist/pkg-signed/$(basename "${packages[0]}")" \
            --identity "$MACOS_INSTALLER_IDENTITY" \
            --team-id "$MACOS_SIGNING_TEAM_ID" \
            --keychain "$MACOS_SIGNING_KEYCHAIN" \
            --notary-profile nvbroadcast-notary \
            --evidence-dir dist/macos-signing/evidence \
            --checkpoint-dir dist/macos-notarization-checkpoint

      - name: Upload verified signed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-signed-packages
          path: dist/pkg-signed/*.pkg
          if-no-files-found: error

      - name: Upload signing verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-signing-evidence-attempt-${{ github.run_attempt }}
          path: dist/macos-signing/evidence
          if-no-files-found: ignore

      - name: Retain the exact notarization submission for recovery
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-notarization-checkpoint-attempt-${{ github.run_attempt }}
          path: dist/macos-notarization-checkpoint
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${MACOS_SIGNING_TEMP:-}" ]]; then
            case "$MACOS_SIGNING_TEMP" in
              "$RUNNER_TEMP"/nvbroadcast-signing.*) ;;
              *) echo "::error::Unexpected signing temporary directory"; exit 1 ;;
            esac
            keychain="$MACOS_SIGNING_TEMP/installer.keychain-db"
            cleanup_status=0
            if [[ -f "$keychain" ]]; then
              /usr/bin/security delete-keychain "$keychain" || cleanup_status=$?
            fi
            # Remove bounded private staging even if keychain deletion failed.
            if [[ "$(dirname "$MACOS_SIGNING_TEMP")" != "$RUNNER_TEMP" || -L "$MACOS_SIGNING_TEMP" ]]; then
              echo "::error::Refusing redirected signing cleanup directory"
              exit 1
            fi
            rm -rf -- "$MACOS_SIGNING_TEMP" || cleanup_status=$?
            exit "$cleanup_status"
          fi

  # ─── Test: macOS platform + prototype extension compilation ────────────────
  macos-recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.macos_recovery_operation != 'none'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/macos-notarization-recovery.yml
    secrets:
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
      MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
    with:
      operation: ${{ inputs.macos_recovery_operation }}
      submission_id: ${{ inputs.submission_id }}
      source_run_id: ${{ inputs.source_run_id }}
      source_attempt: ${{ inputs.source_attempt }}
      source_sha256: ${{ inputs.source_sha256 }}
      signed_sha256: ${{ inputs.signed_sha256 }}

  test-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.macos_recovery_operation == 'none'
    name: Test macOS (Apple Silicon, Python ${{ matrix.python-version }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python3 -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0" wheel
          python3 -m pip install ".[dev,cpu]"
          python3 -m pip install "pip-audit>=2.9"
          python3 -m pip check
          python3 -m pip_audit --skip-editable

      - name: Run macOS-safe unit tests
        run: |
          PYTHONPATH=src python3 -m pytest -q \
            tests/test_macos_camera.py \
            tests/test_macos_signing.py \
            tests/test_macos_signing_workflow.py \
            tests/test_macos_notarization_resume_artifacts.py \
            tests/test_macos_package_install.py \
            tests/test_eye_contact.py \
            tests/test_updates.py

      - name: Test platform detection
        run: |
          PYTHONPATH=src python3 -c "
          from nvbroadcast.core.platform import IS_MACOS, IS_LINUX, has_nvidia_gpu
          from nvbroadcast.core.platform import get_gst_camera_source, get_onnx_providers
          assert IS_MACOS == True
          assert IS_LINUX == False
          assert has_nvidia_gpu() == False
          assert get_gst_camera_source() == 'avfvideosrc'
          providers = get_onnx_providers()
          assert providers[-1] == 'CPUExecutionProvider'
          print('All macOS platform tests passed')
          "

      - name: Test frame bridge
        run: |
          PYTHONPATH=. python3 -c "
          from macos.NVBroadcastHelper.frame_bridge import FrameBridge
          import numpy as np
          bridge = FrameBridge(width=640, height=480)
          frame = np.zeros((480, 640, 4), dtype=np.uint8)
          bridge.write_numpy_frame(frame)
          bridge.close()
          print('Frame bridge test: OK')
          "

      - name: Validate OBS virtual-camera API
        run: |
          python3 -c "
          import inspect
          import mediapipe
          import onnxruntime
          import pyvirtualcam
          from packaging.version import Version
          assert Version(mediapipe.__version__) >= Version('1.0.0')
          ort_version = Version(onnxruntime.__version__)
          assert Version('1.23.2') <= ort_version < Version('1.24')
          assert pyvirtualcam.PixelFormat.BGR.value == '24BG'
          assert 'backend' in inspect.signature(pyvirtualcam.Camera).parameters
          print(f'ONNX Runtime {onnxruntime.__version__}: macOS universal baseline available')
          print(f'pyvirtualcam {pyvirtualcam.__version__}: OBS API available')
          "

      - name: Test prototype Swift extension compilation
        if: matrix.python-version == '3.12'
        run: |
          bash macos/build.sh
          test -f macos/.build/NVBroadcastExtension.systemextension/Contents/MacOS/NVBroadcastExtension
          echo "Swift extension compiled successfully"
          file macos/.build/NVBroadcastExtension.systemextension/Contents/MacOS/NVBroadcastExtension

  # ─── Test: Linux platform checks ───────────────────────────────────────────
  test-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.macos_recovery_operation == 'none'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            runner: ubuntu-latest
          - name: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Linux desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base

      - name: Create release-smoke venv
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0" wheel

      - name: Validate arm64 Python wheel availability
        if: matrix.name == 'arm64'
        run: |
          .venv/bin/python -m pip download \
            --dest /tmp/arm64-wheel-check \
            --only-binary=:all: \
            --platform manylinux2014_aarch64 \
            --platform manylinux_2_27_aarch64 \
            --platform manylinux_2_28_aarch64 \
            --python-version 312 \
            --implementation cp \
            --abi cp312 \
            numpy "opencv-contrib-python>=4.8.1.78,<5" "mediapipe==1.0.0" "protobuf>=6.33.5,<7" onnxruntime==1.24.4 "onnx>=1.22.0" "click>=8.3.3" scipy "Pillow>=12.3.0" requests psutil pyrnnoise "av>=16,<17" faster-whisper==1.2.1 ctranslate2 huggingface-hub httpx tokenizers soundfile tqdm packaging "setuptools>=83.0.0"

      - name: Install Linux project dependencies
        run: |
          .venv/bin/python -m pip install ".[dev,cpu]"
          .venv/bin/python -m pip install "pip-audit>=2.9" "bandit>=1.8"
          .venv/bin/python -m pip check
          # Audit the project resolution, excluding unrelated Ubuntu packages
          # exposed by the system-site venv for GTK/GStreamer.
          .venv/bin/python -m pip_audit . --skip-editable --progress-spinner off
          .venv/bin/python -m bandit -q -r src -ll

      - name: Test platform detection
        run: |
          PYTHONPATH=src python3 -c "
          from nvbroadcast.core.platform import IS_MACOS, IS_LINUX
          from nvbroadcast.core.platform import get_gst_camera_source
          assert IS_LINUX == True
          assert IS_MACOS == False
          assert get_gst_camera_source() == 'v4l2src'
          print('Linux platform detection: OK')
          "

      - name: Syntax check all Python files
        run: |
          find src -name '*.py' -exec python3 -m py_compile {} \;
          python3 -m py_compile macos/NVBroadcastHelper/frame_bridge.py
          echo "All Python files compile: OK"

      - name: Release smoke checks
        run: ./.venv/bin/python scripts/release_smoke.py

  # ─── Test: supported Python runtime compatibility ──────────────────────────
  test-python:
    if: github.event_name != 'workflow_dispatch' || inputs.macos_recovery_operation == 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0" wheel
          python -m pip install ".[dev,cpu]"
          python -m pip check

      - name: Run cross-version unit tests
        run: |
          python -m pytest \
            tests/test_autoframe.py \
            tests/test_background_overlay.py \
            tests/test_config_persistence.py \
            tests/test_deepfilter_model.py \
            tests/test_eye_contact.py \
            tests/test_model_download.py \
            tests/test_summarizer.py \
            tests/test_tensorrt_rvm.py \
            tests/test_training_bundle.py \
            tests/test_updates.py \
            tests/test_voice_fx.py

  # ─── Attest: sign exact artifacts after every release gate passes ──────────
  attest-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, test-macos, test-macos-runtime, test-linux, test-python, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Generate native package checksums
        run: |
          python3 scripts/generate_release_checksums.py \
            --output artifacts/SHA256SUMS.packages \
            artifacts/linux-packages/deb/*.deb \
            artifacts/linux-packages/rpm/*.rpm \
            artifacts/linux-packages/nvbroadcast-native-upgrade \
            artifacts/macos-signed-packages/*.pkg

      - name: Attest release package provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            artifacts/linux-packages/deb/*.deb
            artifacts/linux-packages/rpm/*.rpm
            artifacts/linux-packages/nvbroadcast-native-upgrade
            artifacts/macos-signed-packages/*.pkg
            artifacts/SHA256SUMS.packages

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-metadata
          path: artifacts/SHA256SUMS.packages

  # ─── Release: Upload attested packages on tag push ──────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: attest-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Validate release tag matches package version
        run: |
          PACKAGE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n1)"
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/linux-packages/deb/*.deb
            artifacts/linux-packages/rpm/*.rpm
            artifacts/linux-packages/nvbroadcast-native-upgrade
            artifacts/macos-signed-packages/*.pkg
            artifacts/release-metadata/SHA256SUMS.packages
          fail_on_unmatched_files: true
