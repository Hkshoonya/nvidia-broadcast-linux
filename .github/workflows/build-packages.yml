name: Build Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ─── Linux: .deb + .rpm ────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm python3

      - name: Build .deb package
        run: bash build-packages.sh deb

      - name: Build .rpm package
        run: bash build-packages.sh rpm

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: |
            dist/deb/*.deb
            dist/rpm/*.rpm

  # ─── macOS: .pkg ───────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      - name: Build .pkg installer
        run: bash build-packages.sh pkg

      - name: Inspect .pkg payload
        run: |
          package="$(find dist/pkg -name '*.pkg' -type f -print -quit)"
          test -n "$package"
          rm -rf /tmp/nvbroadcast-pkg-expanded
          pkgutil --expand-full "$package" /tmp/nvbroadcast-pkg-expanded
          test -n "$(find /tmp/nvbroadcast-pkg-expanded -path '*/opt/nvbroadcast/src/nvbroadcast/__init__.py' -print -quit)"
          test -n "$(find /tmp/nvbroadcast-pkg-expanded -path '*/usr/local/bin/nvbroadcast' -print -quit)"
          find /tmp/nvbroadcast-pkg-expanded -name postinstall -type f -exec bash -n {} \;

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-packages
          path: dist/pkg/*.pkg

  # ─── Test: macOS platform + prototype extension compilation ────────────────
  test-macos:
    name: Test macOS (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
          - name: Intel
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install project and test dependencies
        run: |
          python3 -m pip install --upgrade "pip>=26.1.2"
          python3 -m pip install ".[dev]"
          python3 -m pip check

      - name: Run macOS-safe unit tests
        run: |
          PYTHONPATH=src python3 -m unittest -v tests.test_updates

      - name: Test platform detection
        run: |
          PYTHONPATH=src python3 -c "
          from nvbroadcast.core.platform import IS_MACOS, IS_LINUX, has_nvidia_gpu
          from nvbroadcast.core.platform import get_gst_camera_source, get_onnx_providers
          assert IS_MACOS == True
          assert IS_LINUX == False
          assert has_nvidia_gpu() == False
          assert get_gst_camera_source() == 'avfvideosrc'
          providers = get_onnx_providers()
          assert providers[-1] == 'CPUExecutionProvider'
          print('All macOS platform tests passed')
          "

      - name: Test frame bridge
        run: |
          PYTHONPATH=. python3 -c "
          from macos.NVBroadcastHelper.frame_bridge import FrameBridge
          import numpy as np
          bridge = FrameBridge(width=640, height=480)
          frame = np.zeros((480, 640, 4), dtype=np.uint8)
          bridge.write_numpy_frame(frame)
          bridge.close()
          print('Frame bridge test: OK')
          "

      - name: Validate OBS virtual-camera API
        run: |
          python3 -c "
          import inspect
          import pyvirtualcam
          assert pyvirtualcam.PixelFormat.BGR.value == '24BG'
          assert 'backend' in inspect.signature(pyvirtualcam.Camera).parameters
          print(f'pyvirtualcam {pyvirtualcam.__version__}: OBS API available')
          "

      - name: Test prototype Swift extension compilation
        run: |
          bash macos/build.sh
          test -f macos/.build/NVBroadcastExtension.systemextension/Contents/MacOS/NVBroadcastExtension
          echo "Swift extension compiled successfully"
          file macos/.build/NVBroadcastExtension.systemextension/Contents/MacOS/NVBroadcastExtension

  # ─── Test: Linux platform checks ───────────────────────────────────────────
  test-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            runner: ubuntu-latest
          - name: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Create release-smoke venv
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade "pip>=26.1.2"

      - name: Validate arm64 Python wheel availability
        if: matrix.name == 'arm64'
        run: |
          .venv/bin/python -m pip download \
            --dest /tmp/arm64-wheel-check \
            --only-binary=:all: \
            --platform manylinux2014_aarch64 \
            --platform manylinux_2_27_aarch64 \
            --platform manylinux_2_28_aarch64 \
            --python-version 312 \
            --implementation cp \
            --abi cp312 \
            numpy opencv-python-headless onnxruntime==1.24.4 "onnx>=1.22.0" "click>=8.3.3" scipy Pillow requests psutil pyrnnoise "av>=16,<17" mediapipe faster-whisper ctranslate2 huggingface-hub httpx tokenizers soundfile tqdm

      - name: Install Linux project dependencies
        run: |
          .venv/bin/python -m pip install ".[dev]"
          .venv/bin/python -m pip check

      - name: Test platform detection
        run: |
          PYTHONPATH=src python3 -c "
          from nvbroadcast.core.platform import IS_MACOS, IS_LINUX
          from nvbroadcast.core.platform import get_gst_camera_source
          assert IS_LINUX == True
          assert IS_MACOS == False
          assert get_gst_camera_source() == 'v4l2src'
          print('Linux platform detection: OK')
          "

      - name: Syntax check all Python files
        run: |
          find src -name '*.py' -exec python3 -m py_compile {} \;
          python3 -m py_compile macos/NVBroadcastHelper/frame_bridge.py
          echo "All Python files compile: OK"

      - name: Release smoke checks
        run: ./.venv/bin/python scripts/release_smoke.py

  # ─── Test: supported Python runtime compatibility ──────────────────────────
  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install ".[dev]"
          python -m pip check

      - name: Run cross-version unit tests
        run: |
          python -m pytest \
            tests/test_autoframe.py \
            tests/test_background_overlay.py \
            tests/test_config_persistence.py \
            tests/test_deepfilter_model.py \
            tests/test_model_download.py \
            tests/test_summarizer.py \
            tests/test_training_bundle.py \
            tests/test_updates.py \
            tests/test_voice_fx.py

  # ─── Release: Upload packages on tag push ──────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, test-macos, test-linux, test-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate release tag matches package version
        run: |
          PACKAGE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n1)"
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/linux-packages/deb/*.deb
            artifacts/linux-packages/rpm/*.rpm
            artifacts/macos-packages/pkg/*.pkg
