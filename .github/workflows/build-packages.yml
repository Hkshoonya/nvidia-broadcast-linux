name: Build Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONNOUSERSITE: "1"

permissions:
  contents: read

jobs:
  # ─── Linux: .deb + .rpm ────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm python3

      - name: Build .deb package
        run: bash build-packages.sh deb

      - name: Build .rpm package
        run: bash build-packages.sh rpm

      - name: Inspect attribution records in native packages
        run: |
          deb="$(find dist/deb -name '*.deb' -type f -print -quit)"
          rpm="$(find dist/rpm -name '*.rpm' -type f -print -quit)"
          test -n "$deb"
          test -n "$rpm"
          mkdir -p /tmp/nvbroadcast-deb-attribution
          dpkg-deb -x "$deb" /tmp/nvbroadcast-deb-attribution
          test -f /tmp/nvbroadcast-deb-attribution/opt/nvbroadcast/NOTICE
          test -f /tmp/nvbroadcast-deb-attribution/opt/nvbroadcast/CONTRIBUTORS.md
          test -f /tmp/nvbroadcast-deb-attribution/usr/share/doc/nvbroadcast/NOTICE
          test -f /tmp/nvbroadcast-deb-attribution/usr/share/doc/nvbroadcast/CONTRIBUTORS.md
          rpm -qlp "$rpm" > /tmp/nvbroadcast-rpm-files
          grep -Fxq '/opt/nvbroadcast/NOTICE' /tmp/nvbroadcast-rpm-files
          grep -Fxq '/opt/nvbroadcast/CONTRIBUTORS.md' /tmp/nvbroadcast-rpm-files
          grep -Fq '/usr/share/licenses/nvbroadcast' /tmp/nvbroadcast-rpm-files
          grep -Fq '/usr/share/doc/nvbroadcast/CONTRIBUTORS.md' /tmp/nvbroadcast-rpm-files

      - name: Build verified native-package upgrader
        run: |
          bash build-packages.sh upgrade-helper
          test -x dist/nvbroadcast-native-upgrade
          if grep -Eq '@(TARGET_(VERSION|REVISION)|DEB_SHA256|RPM_SHA256)@' dist/nvbroadcast-native-upgrade; then
            echo "::error::Native-package upgrader contains unresolved release placeholders."
            exit 1
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-packages
          path: |
            dist/deb/*.deb
            dist/rpm/*.rpm
            dist/nvbroadcast-native-upgrade

  # ─── macOS: .pkg ───────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      - name: Build .pkg installer
        run: bash build-packages.sh pkg

      - name: Inspect .pkg payload
        run: |
          package="$(find dist/pkg -name '*.pkg' -type f -print -quit)"
          test -n "$package"
          rm -rf /tmp/nvbroadcast-pkg-expanded
          pkgutil --expand-full "$package" /tmp/nvbroadcast-pkg-expanded
          test -n "$(find /tmp/nvbroadcast-pkg-expanded -path '*/opt/nvbroadcast/src/nvbroadcast/__init__.py' -print -quit)"
          test -n "$(find /tmp/nvbroadcast-pkg-expanded -path '*/opt/nvbroadcast/NOTICE' -print -quit)"
          test -n "$(find /tmp/nvbroadcast-pkg-expanded -path '*/opt/nvbroadcast/CONTRIBUTORS.md' -print -quit)"
          test -n "$(find /tmp/nvbroadcast-pkg-expanded -path '*/usr/local/bin/nvbroadcast' -print -quit)"
          runtime_installer="$(find /tmp/nvbroadcast-pkg-expanded -path '*/opt/nvbroadcast/scripts/install_runtime_variant.py' -print -quit)"
          test -x "$runtime_installer"
          distribution="$(find /tmp/nvbroadcast-pkg-expanded -name Distribution -type f -print -quit)"
          test -n "$distribution"
          grep -q 'hostArchitectures="arm64"' "$distribution"
          grep -q '<os-version min="13.0"' "$distribution"
          find /tmp/nvbroadcast-pkg-expanded -name postinstall -type f -exec bash -n {} \;

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-packages
          path: dist/pkg/*.pkg

  # ─── Test: macOS platform + prototype extension compilation ────────────────
  test-macos:
    name: Test macOS (Apple Silicon, Python ${{ matrix.python-version }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python3 -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0" wheel
          python3 -m pip install ".[dev,cpu]"
          python3 -m pip install "pip-audit>=2.9"
          python3 -m pip check
          python3 -m pip_audit --skip-editable

      - name: Run macOS-safe unit tests
        run: |
          PYTHONPATH=src python3 -m pytest -q \
            tests/test_macos_camera.py \
            tests/test_eye_contact.py \
            tests/test_updates.py

      - name: Test platform detection
        run: |
          PYTHONPATH=src python3 -c "
          from nvbroadcast.core.platform import IS_MACOS, IS_LINUX, has_nvidia_gpu
          from nvbroadcast.core.platform import get_gst_camera_source, get_onnx_providers
          assert IS_MACOS == True
          assert IS_LINUX == False
          assert has_nvidia_gpu() == False
          assert get_gst_camera_source() == 'avfvideosrc'
          providers = get_onnx_providers()
          assert providers[-1] == 'CPUExecutionProvider'
          print('All macOS platform tests passed')
          "

      - name: Test frame bridge
        run: |
          PYTHONPATH=. python3 -c "
          from macos.NVBroadcastHelper.frame_bridge import FrameBridge
          import numpy as np
          bridge = FrameBridge(width=640, height=480)
          frame = np.zeros((480, 640, 4), dtype=np.uint8)
          bridge.write_numpy_frame(frame)
          bridge.close()
          print('Frame bridge test: OK')
          "

      - name: Validate OBS virtual-camera API
        run: |
          python3 -c "
          import inspect
          import mediapipe
          import onnxruntime
          import pyvirtualcam
          from packaging.version import Version
          assert Version(mediapipe.__version__) >= Version('1.0.0')
          ort_version = Version(onnxruntime.__version__)
          assert Version('1.23.2') <= ort_version < Version('1.24')
          assert pyvirtualcam.PixelFormat.BGR.value == '24BG'
          assert 'backend' in inspect.signature(pyvirtualcam.Camera).parameters
          print(f'ONNX Runtime {onnxruntime.__version__}: macOS universal baseline available')
          print(f'pyvirtualcam {pyvirtualcam.__version__}: OBS API available')
          "

      - name: Test prototype Swift extension compilation
        if: matrix.python-version == '3.12'
        run: |
          bash macos/build.sh
          test -f macos/.build/NVBroadcastExtension.systemextension/Contents/MacOS/NVBroadcastExtension
          echo "Swift extension compiled successfully"
          file macos/.build/NVBroadcastExtension.systemextension/Contents/MacOS/NVBroadcastExtension

  # ─── Test: Linux platform checks ───────────────────────────────────────────
  test-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            runner: ubuntu-latest
          - name: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Linux desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base

      - name: Create release-smoke venv
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0" wheel

      - name: Validate arm64 Python wheel availability
        if: matrix.name == 'arm64'
        run: |
          .venv/bin/python -m pip download \
            --dest /tmp/arm64-wheel-check \
            --only-binary=:all: \
            --platform manylinux2014_aarch64 \
            --platform manylinux_2_27_aarch64 \
            --platform manylinux_2_28_aarch64 \
            --python-version 312 \
            --implementation cp \
            --abi cp312 \
            numpy "opencv-contrib-python>=4.8.1.78,<5" "mediapipe==1.0.0" "protobuf>=6.33.5,<7" onnxruntime==1.24.4 "onnx>=1.22.0" "click>=8.3.3" scipy "Pillow>=12.3.0" requests psutil pyrnnoise "av>=16,<17" faster-whisper==1.2.1 ctranslate2 huggingface-hub httpx tokenizers soundfile tqdm packaging "setuptools>=83.0.0"

      - name: Install Linux project dependencies
        run: |
          .venv/bin/python -m pip install ".[dev,cpu]"
          .venv/bin/python -m pip install "pip-audit>=2.9" "bandit>=1.8"
          .venv/bin/python -m pip check
          # Audit the project resolution, excluding unrelated Ubuntu packages
          # exposed by the system-site venv for GTK/GStreamer.
          .venv/bin/python -m pip_audit . --skip-editable --progress-spinner off
          .venv/bin/python -m bandit -q -r src -ll

      - name: Test platform detection
        run: |
          PYTHONPATH=src python3 -c "
          from nvbroadcast.core.platform import IS_MACOS, IS_LINUX
          from nvbroadcast.core.platform import get_gst_camera_source
          assert IS_LINUX == True
          assert IS_MACOS == False
          assert get_gst_camera_source() == 'v4l2src'
          print('Linux platform detection: OK')
          "

      - name: Syntax check all Python files
        run: |
          find src -name '*.py' -exec python3 -m py_compile {} \;
          python3 -m py_compile macos/NVBroadcastHelper/frame_bridge.py
          echo "All Python files compile: OK"

      - name: Release smoke checks
        run: ./.venv/bin/python scripts/release_smoke.py

  # ─── Test: supported Python runtime compatibility ──────────────────────────
  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0" wheel
          python -m pip install ".[dev,cpu]"
          python -m pip check

      - name: Run cross-version unit tests
        run: |
          python -m pytest \
            tests/test_autoframe.py \
            tests/test_background_overlay.py \
            tests/test_config_persistence.py \
            tests/test_deepfilter_model.py \
            tests/test_eye_contact.py \
            tests/test_model_download.py \
            tests/test_summarizer.py \
            tests/test_tensorrt_rvm.py \
            tests/test_training_bundle.py \
            tests/test_updates.py \
            tests/test_voice_fx.py

  # ─── Attest: sign exact artifacts after every release gate passes ──────────
  attest-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, test-macos, test-linux, test-python]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Generate native package checksums
        run: |
          python3 scripts/generate_release_checksums.py \
            --output artifacts/SHA256SUMS.packages \
            artifacts/linux-packages/deb/*.deb \
            artifacts/linux-packages/rpm/*.rpm \
            artifacts/linux-packages/nvbroadcast-native-upgrade \
            artifacts/macos-packages/*.pkg

      - name: Attest release package provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            artifacts/linux-packages/deb/*.deb
            artifacts/linux-packages/rpm/*.rpm
            artifacts/linux-packages/nvbroadcast-native-upgrade
            artifacts/macos-packages/*.pkg
            artifacts/SHA256SUMS.packages

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-metadata
          path: artifacts/SHA256SUMS.packages

  # ─── Release: Upload attested packages on tag push ──────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: attest-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Validate release tag matches package version
        run: |
          PACKAGE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n1)"
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/linux-packages/deb/*.deb
            artifacts/linux-packages/rpm/*.rpm
            artifacts/linux-packages/nvbroadcast-native-upgrade
            artifacts/macos-packages/*.pkg
            artifacts/release-metadata/SHA256SUMS.packages
          fail_on_unmatched_files: true
