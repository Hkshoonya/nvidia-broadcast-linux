name: Sign and qualify approved native candidate

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Approved native runtime variant'
        type: choice
        options: [cpu, cuda]
        required: true
        default: cpu
      producer_run:
        description: 'Successful main native candidate run ID'
        type: string
        required: true
      producer_attempt:
        description: 'Exact producer run attempt'
        type: string
        required: true
      source_commit:
        description: 'Full application/adapter commit; must be an ancestor of this main checkout'
        type: string
        required: true
      artifact_id:
        description: 'Exact unexpired native candidate artifact ID'
        type: string
        required: true
      artifact_digest:
        description: 'Approved artifact digest, including sha256: prefix'
        type: string
        required: true
      package_revision:
        description: 'Exact positive integer native package revision'
        type: string
        required: true
      python_inventory:
        description: 'Retain partial Python METADATA SPDX evidence after native qualification'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ inputs.variant }}-finalization-${{ inputs.artifact_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONNOUSERSITE: '1'

jobs:
  validate:
    if: github.repository == 'Hkshoonya/nvidia-broadcast-linux' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      receipt: ${{ steps.identity.outputs.receipt }}
      artifact_id: ${{ steps.transfer.outputs.artifact-id }}
      projection_artifact_id: ${{ steps.projection-transfer.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require sufficient workspace, temporary and Docker storage
        env:
          CANDIDATE_VARIANT: ${{ inputs.variant }}
          PYTHON_INVENTORY: ${{ inputs.python_inventory }}
        run: |
          /usr/bin/python3 -I -S - <<'PY'
          import importlib.util, os, shutil, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('candidate_policy', 'packaging/native-runtime/candidate_policy.py')
          policy_module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = policy_module
          spec.loader.exec_module(policy_module)
          policy = policy_module.policy_for(os.environ['CANDIDATE_VARIANT'])
          free = {name: shutil.disk_usage(os.environ[name]).free for name in ('GITHUB_WORKSPACE', 'RUNNER_TEMP', 'HOME')}
          required = policy.capacity_bytes + (256 * 1024**2 if os.environ.get('PYTHON_INVENTORY', 'false') == 'true' else 0)
          if any(value < required for value in free.values()):
              raise SystemExit(f'Candidate validation allocation requires {required} free bytes; observed {free}')
          Path('dist/builder-delivery').mkdir(parents=True, exist_ok=True)
          PY
      - name: Enable an isolated containerd image store
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.8.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Authenticate historical builders before loading native decoders
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_id="$(/usr/bin/python3 -I -S -c 'import json; print(json.load(open("packaging/native-runtime/builder-delivery.json"))["source"]["asset_id"])')"
          /usr/bin/python3 -I -S packaging/native-runtime/builder_delivery.py fetch \
            --asset-id "$asset_id" --archive dist/builder-delivery/builders.tar
          /usr/bin/python3 -I -S packaging/native-runtime/builder_delivery.py verify --load \
            --archive dist/builder-delivery/builders.tar --report dist/builder-delivery/authenticated-builders.json
      - name: Validate exact producer metadata, complete payload and source-matched scripts
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.producer_run }}
          PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          PACKAGE_REVISION: ${{ inputs.package_revision }}
          CANDIDATE_VARIANT: ${{ inputs.variant }}
          PYTHON_INVENTORY: ${{ inputs.python_inventory }}
        run: |
          projection_args=()
          if [ "$PYTHON_INVENTORY" = true ]; then
            projection_args+=(--python-inventory-output dist/python-inventory-projection)
          fi
          /usr/bin/python3 -I -S packaging/native-runtime/validate_candidate.py \
            --run-id "$PRODUCER_RUN" --attempt "$PRODUCER_ATTEMPT" --source "$SOURCE_COMMIT" \
            --artifact-id "$ARTIFACT_ID" --expected-digest "$ARTIFACT_DIGEST" \
            --package-revision "$PACKAGE_REVISION" --variant "$CANDIDATE_VARIANT" --repo "$GITHUB_WORKSPACE" --output dist/validated \
            "${projection_args[@]}"
      - name: Bind validated transfer to this job
        id: identity
        run: |
          /usr/bin/python3 -I -S - <<'PY'
          import hashlib, os
          with open('dist/validated/result.json', 'rb') as source:
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'receipt={digest}\n')
          PY
      - name: Transfer validated unsigned input; not a qualified candidate
        id: transfer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ inputs.variant }}-validated-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/validated/
            !dist/validated/candidate.zip
      - name: Transfer only the authenticated optional metadata projection
        id: projection-transfer
        if: inputs.python_inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ inputs.variant }}-python-projection-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          path: dist/python-inventory-projection/

  sign:
    needs: validate
    if: github.repository == 'Hkshoonya/nvidia-broadcast-linux' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: rpm-signing
    outputs:
      manifest: ${{ steps.identity.outputs.manifest }}
      artifact_id: ${{ steps.transfer.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require enough storage for the selected native candidate
        env:
          CANDIDATE_VARIANT: ${{ inputs.variant }}
        run: |
          /usr/bin/python3 -I -S - <<'PY'
          import importlib.util, os, shutil, sys
          spec = importlib.util.spec_from_file_location('candidate_policy', 'packaging/native-runtime/candidate_policy.py')
          policy_module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = policy_module
          spec.loader.exec_module(policy_module)
          policy = policy_module.policy_for(os.environ['CANDIDATE_VARIANT'])
          free = {name: shutil.disk_usage(os.environ[name]).free for name in ('GITHUB_WORKSPACE', 'RUNNER_TEMP', 'HOME')}
          if any(value < policy.capacity_bytes for value in free.values()):
              raise SystemExit(f'{policy.variant} candidate allocation requires {policy.capacity_bytes} free bytes; observed {free}')
          PY
      - name: Prepare native signing tools before exposing signing credentials
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm gnupg2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          merge-multiple: true
          path: dist/validated
      - name: Sign reviewed RPM bytes and regenerate checksum-bound upgrade helper
        env:
          VALIDATION_RECEIPT: ${{ needs.validate.outputs.receipt }}
          CANDIDATE_VARIANT: ${{ inputs.variant }}
          NVB_RPM_PRIVATE_KEY: ${{ secrets.RPM_SIGNING_PRIVATE_KEY }}
          NVB_RPM_KEY_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
        run: |
          /usr/bin/python3 -I -S packaging/native-runtime/finalize_candidate.py sign \
            --validated dist/validated --expected-receipt "$VALIDATION_RECEIPT" --variant "$CANDIDATE_VARIANT" --output dist/signed
      - name: Bind signed transfer to this job
        id: identity
        run: |
          /usr/bin/python3 -I -S - <<'PY'
          import hashlib, os
          with open('dist/signed/candidate.json', 'rb') as source:
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'manifest={digest}\n')
          PY
      - name: Transfer signed bytes awaiting independent qualification
        id: transfer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ inputs.variant }}-signed-awaiting-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: dist/signed/

  qualify-deb:
    needs: sign
    uses: ./.github/workflows/native-cpu-qualify.yml
    with:
      family: deb
      variant: ${{ inputs.variant }}
      signed_artifact_id: ${{ needs.sign.outputs.artifact_id }}
      candidate_manifest: ${{ needs.sign.outputs.manifest }}

  qualify-rpm:
    needs: sign
    uses: ./.github/workflows/native-cpu-qualify.yml
    with:
      family: rpm
      variant: ${{ inputs.variant }}
      signed_artifact_id: ${{ needs.sign.outputs.artifact_id }}
      candidate_manifest: ${{ needs.sign.outputs.manifest }}

  retain:
    needs: [validate, sign, qualify-deb, qualify-rpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require enough storage for the selected native candidate
        env:
          CANDIDATE_VARIANT: ${{ inputs.variant }}
          PYTHON_INVENTORY: ${{ inputs.python_inventory }}
        run: |
          /usr/bin/python3 -I -S - <<'PY'
          import importlib.util, os, shutil, sys
          spec = importlib.util.spec_from_file_location('candidate_policy', 'packaging/native-runtime/candidate_policy.py')
          policy_module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = policy_module
          spec.loader.exec_module(policy_module)
          policy = policy_module.policy_for(os.environ['CANDIDATE_VARIANT'])
          free = {name: shutil.disk_usage(os.environ[name]).free for name in ('GITHUB_WORKSPACE', 'RUNNER_TEMP', 'HOME')}
          required = policy.capacity_bytes + (256 * 1024**2 if os.environ.get('PYTHON_INVENTORY', 'false') == 'true' else 0)
          if any(value < required for value in free.values()):
              raise SystemExit(f'{policy.variant} candidate allocation requires {required} free bytes; observed {free}')
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          merge-multiple: true
          path: dist/signed
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualify-deb.outputs.artifact_id }}
          merge-multiple: true
          path: dist/evidence/deb
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.qualify-rpm.outputs.artifact_id }}
          merge-multiple: true
          path: dist/evidence/rpm
      - name: Require every acceptance gate on the exact final package bytes
        env:
          CANDIDATE_MANIFEST: ${{ needs.sign.outputs.manifest }}
          CANDIDATE_VARIANT: ${{ inputs.variant }}
        run: |
          /usr/bin/python3 -I -S packaging/native-runtime/finalize_candidate.py complete \
            --bundle dist/signed --expected-manifest "$CANDIDATE_MANIFEST" --variant "$CANDIDATE_VARIANT" \
            --deb-evidence dist/evidence/deb --rpm-evidence dist/evidence/rpm --output dist/qualified
      - name: Receive only the optional metadata projection after complete qualification
        if: inputs.python_inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.validate.outputs.projection_artifact_id }}
          merge-multiple: true
          path: dist/python-inventory-projection
      - name: Prepare hash-pinned isolated host metadata and schema tools
        id: inventory-tools
        if: inputs.python_inventory
        timeout-minutes: 3
        run: |
          /usr/bin/python3 -I -S - <<'PY'
          import importlib.util, os, tomllib
          from pathlib import Path
          root = Path.cwd()
          prototype = root / 'packaging/runtime-prototype'
          spec = importlib.util.spec_from_file_location('inventory_input_fetch', prototype / 'prepare.py')
          prepare = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(prepare)
          entries = [p for p in tomllib.loads((prototype / 'pylock.build.toml').read_text())['packages'] if p['name'] == 'packaging']
          if len(entries) != 1 or entries[0]['version'] != '26.0' or len(entries[0]['wheels']) != 1:
              raise SystemExit('Expected the existing reviewed pure host packaging wheel')
          wheel = entries[0]['wheels'][0]
          if not wheel['url'].endswith('/packaging-26.0-py3-none-any.whl'):
              raise SystemExit('Host metadata tool must remain the universal pure wheel')
          cache = root / 'dist/native-inventory-host-tools'
          cache.mkdir(parents=True, exist_ok=True)
          verified = prepare.fetch(cache, {'url': wheel['url'], 'sha256': wheel['hashes']['sha256']})
          if verified.stat().st_size != wheel['size']:
              raise SystemExit('Host metadata tool size differs from the reviewed lock')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('wheel=' + str(verified) + '\n')
          PY
          /usr/bin/python3 -I -S packaging/native-runtime/inventory_host_tools.py \
            --output dist/native-inventory-host-tools/schema
      - name: Retain final archive-bound partial Python SPDX evidence
        if: inputs.python_inventory
        timeout-minutes: 5
        env:
          CANDIDATE_MANIFEST: ${{ needs.sign.outputs.manifest }}
          CANDIDATE_VARIANT: ${{ inputs.variant }}
          HOST_PACKAGING_WHEEL: ${{ steps.inventory-tools.outputs.wheel }}
        run: |
          /usr/bin/python3 -I -S packaging/native-runtime/retain_python_inventory.py \
            --qualified dist/qualified --expected-manifest "$CANDIDATE_MANIFEST" \
            --projection dist/python-inventory-projection --host-packaging-wheel "$HOST_PACKAGING_WHEEL" \
            --schema-tools dist/native-inventory-host-tools/schema \
            --variant "$CANDIDATE_VARIANT"
      - name: Retain complete qualified development candidate without publishing a release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ inputs.variant }}-qualified-${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: dist/qualified/
