name: Build & Publish Snap

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built snap and attach it to an existing release tag.
        required: false
        type: boolean
        default: false
      candidate:
        description: Release to candidate; dispatch from the release tag if this build may be promoted to stable.
        required: false
        type: boolean
        default: false
      review:
        description: Upload the built snap for Store review without releasing it to any channel.
        required: false
        type: boolean
        default: false
      release_tag:
        description: Existing release tag; every Store action must dispatch this workflow from the same tag ref.
        required: false
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-snap:
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Resolve Snap Store target
        id: store-target
        env:
          PUBLISH_CANDIDATE: ${{ inputs.candidate }}
          PUBLISH_STABLE: ${{ inputs.publish }}
          UPLOAD_FOR_REVIEW: ${{ inputs.review }}
        run: |
          ACTION=""
          CHANNEL=""

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            REQUEST_COUNT=0
            for REQUESTED in "$PUBLISH_STABLE" "$PUBLISH_CANDIDATE" "$UPLOAD_FOR_REVIEW"; do
              if [ "$REQUESTED" = "true" ]; then
                REQUEST_COUNT=$((REQUEST_COUNT + 1))
              fi
            done

            if [ "$REQUEST_COUNT" -gt 1 ]; then
              echo "::error::publish, candidate, and review are mutually exclusive."
              exit 1
            fi

            if [ "$PUBLISH_STABLE" = "true" ]; then
              ACTION="release"
              CHANNEL="stable"
            elif [ "$PUBLISH_CANDIDATE" = "true" ]; then
              ACTION="release"
              CHANNEL="candidate"
            elif [ "$UPLOAD_FOR_REVIEW" = "true" ]; then
              ACTION="upload"
            fi
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Resolve release target
        id: release-target
        if: startsWith(github.ref, 'refs/tags/v') || steps.store-target.outputs.action != ''
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          RELEASE_TAG=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$DISPATCH_RELEASE_TAG" ]; then
              RELEASE_TAG="$DISPATCH_RELEASE_TAG"
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              RELEASE_TAG="$GITHUB_REF_NAME"
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::release_tag is required for a Store action unless workflow_dispatch runs from the release tag."
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_tag must be an existing version tag such as v1.5.2."
            exit 1
          fi

          EXPECTED_REF="refs/tags/$RELEASE_TAG"
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "::error::Snap Store actions must run from $EXPECTED_REF so provenance names the release source."
            echo "Dispatch the requested Store action from --ref $RELEASE_TAG and pass release_tag=$RELEASE_TAG."
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")"
          CHECKED_OUT_COMMIT="$(git rev-parse "HEAD^{commit}")"
          if [ "$CHECKED_OUT_COMMIT" != "$TAG_COMMIT" ] || [ "$CHECKED_OUT_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::Checked-out commit, tag commit, and workflow source SHA must match."
            exit 1
          fi

          PACKAGE_VERSION="$(sed -n "s/^version:[[:space:]]*['\"]\([^'\"]*\)['\"]/\1/p" snap/snapcraft.yaml | head -n1)"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match Snap version $PACKAGE_VERSION."
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        id: snapcraft

      - name: Verify Snap excludes runtime pip
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
        run: |
          mapfile -t PIP_PATHS < <(
            unsquashfs -l "$SNAP_PATH" |
              sed -n 's#^squashfs-root/##p' |
              grep -E '(^|/)bin/pip([0-9.]*)$|(^|/)lib/python[^/]+/(site|dist)-packages/pip($|/|-[^/]+\.dist-info($|/))'
          )
          if [ "${#PIP_PATHS[@]}" -ne 0 ]; then
            echo "::error::The immutable Snap must not contain a runtime pip installer."
            printf '%s\n' "${PIP_PATHS[@]}"
            exit 1
          fi
          echo "Verified that the Snap contains no runtime pip installer."

      - name: Verify Snap runtime dependency closure
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
        run: |
          SNAP_ROOT="$(mktemp -d)"
          trap 'rm -rf "$SNAP_ROOT"' EXIT
          unsquashfs -f -d "$SNAP_ROOT" "$SNAP_PATH" >/dev/null

          mapfile -t SNAP_PYTHON_PATHS < <(
            find "$SNAP_ROOT/lib" "$SNAP_ROOT/usr/lib" \
              -type d \( -name site-packages -o -name dist-packages \) \
              -print | sort
          )
          if [ "${#SNAP_PYTHON_PATHS[@]}" -eq 0 ]; then
            echo "::error::The Snap contains no discoverable Python package roots."
            exit 1
          fi
          SNAP_PYTHONPATH="$(IFS=:; printf '%s' "${SNAP_PYTHON_PATHS[*]}")"
          PYTHONPATH="$SNAP_PYTHONPATH" python3 -S \
            scripts/validate_snap_runtime.py "$SNAP_ROOT" \
            --platform-machine "${{ matrix.arch }}"

      - name: Attest Snap provenance
        if: startsWith(github.ref, 'refs/tags/v') || steps.store-target.outputs.action != ''
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.snapcraft.outputs.snap }}

      - name: Upload snap artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snap-package-${{ matrix.arch }}
          path: ${{ steps.snapcraft.outputs.snap }}

      - name: Validate Snap Store registration
        if: steps.store-target.outputs.action != ''
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ steps.store-target.outputs.channel == 'stable' && secrets.SNAP_TOKEN || secrets.SNAP_CANDIDATE_TOKEN }}
        run: |
          SNAP_NAME="$(sed -n 's/^name:[[:space:]]*//p' snap/snapcraft.yaml | head -n1)"
          if [ -z "$SNAP_NAME" ]; then
            echo "::error::Could not read snap name from snap/snapcraft.yaml"
            exit 1
          fi

          if ! snapcraft revisions "$SNAP_NAME" >/tmp/snap-store-check.log 2>&1; then
            cat /tmp/snap-store-check.log
            if grep -qi "resource-not-found: Snap not found for name=$SNAP_NAME" /tmp/snap-store-check.log; then
              echo "::error::Snap '$SNAP_NAME' is not registered in the Snap Store for the account behind SNAP_TOKEN. Register it first with 'snapcraft register $SNAP_NAME' or rename snap/snapcraft.yaml to a snap name already registered to that account."
            else
              echo "::error::Snap Store validation failed for '$SNAP_NAME'. See the log output above."
            fi
            exit 1
          fi

      - name: Upload to Snap Store for review
        if: steps.store-target.outputs.action == 'upload'
        timeout-minutes: 60
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_CANDIDATE_TOKEN }}
        run: snapcraft upload "${{ steps.snapcraft.outputs.snap }}"

      - name: Publish to Snap Store
        if: steps.store-target.outputs.action == 'release'
        timeout-minutes: 60
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ steps.store-target.outputs.channel == 'stable' && secrets.SNAP_TOKEN || secrets.SNAP_CANDIDATE_TOKEN }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: ${{ steps.store-target.outputs.channel }}

      - name: Update Snap Store metadata
        if: steps.store-target.outputs.channel == 'stable' && matrix.arch == 'arm64'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_TOKEN }}
        run: snapcraft upload-metadata "${{ steps.snapcraft.outputs.snap }}" --force

      - name: Show Snap Store revisions
        if: always() && steps.store-target.outputs.action != ''
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ steps.store-target.outputs.channel == 'stable' && secrets.SNAP_TOKEN || secrets.SNAP_CANDIDATE_TOKEN }}
        run: snapcraft revisions nvbroadcast --arch "${{ matrix.arch }}"

  attest-snap-checksums:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    needs: build-snap
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download Snap artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Generate complete Snap checksums
        run: |
          shopt -s nullglob
          SNAP_FILES=(artifacts/snap-package-*/*.snap)
          if [ "${#SNAP_FILES[@]}" -ne 2 ]; then
            echo "::error::Expected exactly one Snap artifact for each architecture."
            exit 1
          fi
          for ARCH in amd64 arm64; do
            ARCH_FILES=(artifacts/snap-package-"$ARCH"/*.snap)
            if [ "${#ARCH_FILES[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $ARCH Snap artifact."
              exit 1
            fi
          done
          python3 scripts/generate_release_checksums.py \
            --output SHA256SUMS.snap \
            "${SNAP_FILES[@]}"

      - name: Attest Snap checksum manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: SHA256SUMS.snap

      - name: Upload Snap checksum manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snap-release-checksums
          path: SHA256SUMS.snap

  attach-release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    needs: attest-snap-checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release target
        id: release-target
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          RELEASE_TAG="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_RELEASE_TAG" ]; then
            RELEASE_TAG="$DISPATCH_RELEASE_TAG"
          fi

          EXPECTED_REF="refs/tags/$RELEASE_TAG"
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "::error::Release attachment must run from $EXPECTED_REF."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download Snap artifacts and checksum manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Select GitHub-sized release assets
        run: |
          test -f artifacts/snap-release-checksums/SHA256SUMS.snap
          mkdir -p release-assets
          if [ -n "$(find release-assets -mindepth 1 -print -quit)" ]; then
            echo "::error::Release asset staging directory must be empty."
            exit 1
          fi
          cp artifacts/snap-release-checksums/SHA256SUMS.snap release-assets/SHA256SUMS.snap
          shopt -s nullglob
          SNAP_FILES=(artifacts/snap-package-*/*.snap)
          if [ "${#SNAP_FILES[@]}" -ne 2 ]; then
            echo "::error::Expected exactly one Snap artifact for each architecture."
            exit 1
          fi
          for SNAP_PATH in "${SNAP_FILES[@]}"; do
            EXPECTED_SHA256="$(awk -v name="$(basename "$SNAP_PATH")" '$2 == name { print $1 }' release-assets/SHA256SUMS.snap)"
            ACTUAL_SHA256="$(sha256sum "$SNAP_PATH" | cut -d ' ' -f1)"
            if [ -z "$EXPECTED_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::Snap artifact differs from its attested checksum manifest."
              exit 1
            fi
            SNAP_SIZE="$(stat -c%s "$SNAP_PATH")"
            if [ "$SNAP_SIZE" -lt 2147483648 ]; then
              DESTINATION="release-assets/$(basename "$SNAP_PATH")"
              if [ -e "$DESTINATION" ]; then
                echo "::error::Duplicate Snap release asset name: $(basename "$SNAP_PATH")"
                exit 1
              fi
              cp -- "$SNAP_PATH" "$DESTINATION"
              if ! cmp -s -- "$SNAP_PATH" "$DESTINATION"; then
                echo "::error::Copied Snap differs from the checksummed build artifact."
                exit 1
              fi
            else
              echo "::warning::Skipping GitHub release upload for $SNAP_PATH because it exceeds GitHub's 2 GiB release-asset limit."
            fi
          done

      - name: Refuse stale omitted Snap assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          manifest = Path("release-assets/SHA256SUMS.snap")
          listed = {line.split("  ", 1)[1] for line in manifest.read_text().splitlines()}
          staged = {path.name for path in Path("release-assets").glob("*.snap")}
          omitted = listed - staged
          if not omitted:
              sys.exit(0)

          tag = os.environ["RELEASE_TAG"]
          # The releases-by-tag endpoint hides drafts; the list includes them.
          query = f'.[] | select(.tag_name == {json.dumps(tag)}) | {{tag_name, assets: [.assets[].name]}}'
          response = subprocess.run(
              [
                  "gh", "api", "--paginate", "--jq", query,
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/releases?per_page=100",
              ],
              capture_output=True,
              check=False,
          )
          if response.returncode != 0:
              sys.exit("::error::Cannot check existing release assets; refusing to attach checksums.")

          try:
              releases = [json.loads(line) for line in response.stdout.splitlines() if line]
          except (TypeError, ValueError):
              sys.exit("::error::Malformed release response; refusing to attach checksums.")
          if not releases:
              sys.exit(0)  # A new release has no stale assets.
          if len(releases) != 1 or releases[0].get("tag_name") != tag or not isinstance(releases[0].get("assets"), list):
              sys.exit("::error::Unexpected release response; refusing to attach checksums.")
          existing = set(releases[0]["assets"])
          stale = omitted & existing
          if stale:
              names = ", ".join(sorted(stale))
              sys.exit(f"::error::Existing release contains omitted Snap asset(s): {names}. Resolve manually before replacing SHA256SUMS.snap.")
          PY

      - name: Attach snaps to GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          draft: true
          tag_name: ${{ steps.release-target.outputs.tag }}
          files: release-assets/*
          fail_on_unmatched_files: true
