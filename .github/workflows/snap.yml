name: Build & Publish Snap

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built snap and attach it to an existing release tag.
        required: false
        type: boolean
        default: false
      release_tag:
        description: Existing release tag to attach assets to when publish is enabled.
        required: false
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-snap:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        id: snapcraft

      - name: Upload snap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snap-package-${{ matrix.arch }}
          path: ${{ steps.snapcraft.outputs.snap }}

      - name: Resolve release target
        id: release-target
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          RELEASE_TAG="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="$DISPATCH_RELEASE_TAG"
          fi

          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::release_tag is required when publishing from workflow_dispatch."
            exit 1
          fi

          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "::error::release_tag must be an existing version tag such as v1.3.0."
              exit 1
              ;;
          esac

          PACKAGE_VERSION="$(sed -n "s/^version:[[:space:]]*['\"]\([^'\"]*\)['\"]/\1/p" snap/snapcraft.yaml | head -n1)"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match Snap version $PACKAGE_VERSION."
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate Snap Store registration
        if: steps.release-target.outputs.tag != ''
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_TOKEN }}
        run: |
          SNAP_NAME="$(sed -n 's/^name:[[:space:]]*//p' snap/snapcraft.yaml | head -n1)"
          if [ -z "$SNAP_NAME" ]; then
            echo "::error::Could not read snap name from snap/snapcraft.yaml"
            exit 1
          fi

          if ! snapcraft revisions "$SNAP_NAME" >/tmp/snap-store-check.log 2>&1; then
            cat /tmp/snap-store-check.log
            if grep -qi "resource-not-found: Snap not found for name=$SNAP_NAME" /tmp/snap-store-check.log; then
              echo "::error::Snap '$SNAP_NAME' is not registered in the Snap Store for the account behind SNAP_TOKEN. Register it first with 'snapcraft register $SNAP_NAME' or rename snap/snapcraft.yaml to a snap name already registered to that account."
            else
              echo "::error::Snap Store validation failed for '$SNAP_NAME'. See the log output above."
            fi
            exit 1
          fi

      - name: Publish to Snap Store
        if: steps.release-target.outputs.tag != ''
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_TOKEN }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable

  attach-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    needs: build-snap
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release target
        id: release-target
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          RELEASE_TAG="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="$DISPATCH_RELEASE_TAG"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download Snap artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/

      - name: Select GitHub-sized release assets
        id: release-assets
        run: |
          mkdir -p release-assets
          while IFS= read -r -d '' SNAP_PATH; do
            SNAP_SIZE="$(stat -c%s "$SNAP_PATH")"
            if [ "$SNAP_SIZE" -lt 2147483648 ]; then
              cp "$SNAP_PATH" release-assets/
            else
              echo "::warning::Skipping GitHub release upload for $SNAP_PATH because it exceeds GitHub's 2 GiB release-asset limit."
            fi
          done < <(find artifacts -type f -name '*.snap' -print0)
          if compgen -G 'release-assets/*.snap' >/dev/null; then
            echo "attach=true" >> "$GITHUB_OUTPUT"
          else
            echo "attach=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Snap artifacts fit the GitHub release-asset limit."
          fi

      - name: Attach snaps to GitHub Release
        if: steps.release-assets.outputs.attach == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          tag_name: ${{ steps.release-target.outputs.tag }}
          files: release-assets/*.snap
          fail_on_unmatched_files: true
