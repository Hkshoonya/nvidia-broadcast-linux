name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONNOUSERSITE: "1"

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contributor-credit:
    name: Contributor credit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Verify pull request contributor credit
        env:
          CONTRIBUTOR_LOGIN: ${{ github.event.pull_request.user.login }}
          CONTRIBUTOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          python3 scripts/check_contributor_credit.py \
            --login "$CONTRIBUTOR_LOGIN" \
            --account-type "$CONTRIBUTOR_TYPE"

  linux:
    name: Linux validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base

      - name: Create test environment
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0" wheel
          .venv/bin/python -m pip install ".[dev,cpu]" "pip-audit>=2.9" "bandit>=1.8"
          .venv/bin/python -m pip check

      - name: Audit dependencies and source
        run: |
          .venv/bin/python -m pip_audit . --skip-editable --progress-spinner off
          .venv/bin/python -m bandit -q -r src -ll

      - name: Run unit and packaging checks
        env:
          PYTHONPATH: src
        run: |
          .venv/bin/python -m compileall -q src scripts tests
          .venv/bin/python -m pytest -q --ignore=tests/test_integration.py
          .venv/bin/python scripts/release_smoke.py
          git diff --exit-code

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0" wheel
          python -m pip install ".[dev,cpu]"
          python -m pip check

      - name: Run supported-runtime tests
        run: |
          python -m pytest -q \
            tests/test_autoframe.py \
            tests/test_background_overlay.py \
            tests/test_config_persistence.py \
            tests/test_deepfilter_model.py \
            tests/test_eye_contact.py \
            tests/test_model_download.py \
            tests/test_packaging_metadata.py \
            tests/test_runtime_probe.py \
            tests/test_summarizer.py \
            tests/test_tensorrt_rvm.py \
            tests/test_training_bundle.py \
            tests/test_updates.py \
            tests/test_voice_fx.py
